name: Deka 2 0.2.5 - source reliability
on:
  push:
    branches: [fix/deka2-0.2.5-reliable-source]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: deka2-025-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm test
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser.py
      - run: python tests/mixer-browser.py
      - run: python tests/vk-reliability-browser.py
      - run: python tests/library-boundaries-browser.py
      - run: python tests/landing-entry-browser.py
      - run: python tests/cards-boundary-browser.py
      - run: python tests/hydration-browser.py
      - run: python tests/desktop-flow.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: Deka2-0.2.5-tests, path: test-output/}
  windows:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: {workspaces: src-tauri}
      - run: npm install
      - run: npm run build
      - name: Real installation and desktop shortcut
        shell: pwsh
        run: ./scripts/verify-windows-install.ps1
      - run: python -m pip install -r tests/requirements.txt
      - name: Installed WebView2 app - IPC, visible-source lazy loading and faders
        shell: pwsh
        run: ./scripts/verify-desktop-source.ps1
      - name: Checksums and provenance
        shell: pwsh
        run: |
          '${{ github.sha }}' | Set-Content source-commit.txt
          Get-FileHash Deka2.exe,Deka2-setup.exe -Algorithm SHA256 | ConvertTo-Json | Set-Content checksums.json
      - uses: actions/upload-artifact@v4
        with:
          name: Deka2-0.2.5-Windows
          path: |
            Deka2.exe
            Deka2-setup.exe
            source-commit.txt
            checksums.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: Deka2-0.2.5-native-tests, path: test-output/}
  release:
    needs: [quality, windows]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: Deka2-0.2.5-Windows, path: out}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: deka2-v0.2.5
          target_commitish: ${{ github.sha }}
          name: Дека 2 0.2.5 - Windows
          prerelease: true
          make_latest: false
          body: |
            Windows installer for the independent Deka 2 player. Existing application ID/profile retained.
            Fixes hidden-source synchronization, commands before DOM readiness, late list hydration, and cards-only editorial pagination.
            Imported music appears in Deka. The source window remains visible during the native VK scan, without replacing the player.
            Installer, actual WebView2 IPC, faders and lazy-loading tests passed using synthetic VK pages/local audio.
            The user's real authenticated VK library is NOT tested; no claim of live-library completeness.
            No Android APK in this release. Original Deka/main unchanged.
          files: |
            out/Deka2-setup.exe
            out/Deka2.exe
            out/checksums.json
            out/source-commit.txt
          fail_on_unmatched_files: true
