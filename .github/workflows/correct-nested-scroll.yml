name: Correct nested personal scroll boundary
on:
  push:
    branches: [fix/deka2-0.2.4-player-library]
    paths: [.github/workflows/correct-nested-scroll.yml]
permissions: {contents: write}
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct source, not test expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/library-runtime.js')
          text=p.read_text()
          old='if (s.excluded && s.box && s.box !== h && s.rows.length) {'
          new='if (s.excluded && s.box && s.box !== h && h.contains(s.box) && s.rows.length) {'
          assert text.count(old)==1
          p.write_text(text.replace(old,new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/library-runtime.js
          git commit -m 'Fix ancestor section incorrectly clipping nested scroll host to one viewport'
          git push origin HEAD:fix/deka2-0.2.4-player-library
