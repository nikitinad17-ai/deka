name: Unified Desktop preview - DJ sets and wallpaper
on:
  push:
    branches: [feature/dj-sets-unified-desktop]
permissions:
  contents: read
concurrency:
  group: deka-unified-preview
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/dj_sets.py
      - run: python tests/desktop_session.py
      - run: python tests/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-unified-browser-evidence
          path: test-output/
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm install
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt psutil pillow
      - name: Real EXE - desktop icons, hotkey, set on A and local B
        run: python scripts/native-wallpaper-shell-ci.py Deka.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-unified-native-evidence
          path: |
            test-output/*.json
            test-output/*.txt
            test-output/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-unified-tested-exe
          path: Deka.exe
          if-no-files-found: error
  package:
    needs: [quality, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: desktop-unified-tested-exe
          path: Deka-Desktop-0.19.0-Preview
      - name: Package verified portable executable
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          folder = Path('Deka-Desktop-0.19.0-Preview')
          (folder/'READ-ME.md').write_bytes(Path('docs/UNIFIED-PREVIEW.md').read_bytes())
          digest = hashlib.sha256((folder/'Deka.exe').read_bytes()).hexdigest()
          (folder/'SHA256SUMS.txt').write_text(digest + '  Deka.exe\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Deka-Desktop-0.19.0-Preview-Windows
          path: Deka-Desktop-0.19.0-Preview/
          if-no-files-found: error
