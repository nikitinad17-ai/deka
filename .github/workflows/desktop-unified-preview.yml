name: Unified Desktop preview - DJ sets and wallpaper
on:
  push:
    branches: [feature/dj-sets-unified-desktop]
permissions:
  contents: read
concurrency:
  group: deka-unified-preview
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/dj_sets.py
      - run: python tests/desktop_session.py
      - run: python tests/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-unified-browser-evidence
          path: test-output/
  windows:
    needs: quality
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm install
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt psutil pillow
      - name: Real EXE - desktop icons, hotkey, set on A and local B
        run: python scripts/native-wallpaper-shell-ci.py Deka.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-unified-native-evidence
          path: |
            test-output/*.json
            test-output/*.txt
            test-output/*.png
      - name: Package tested portable executable
        shell: pwsh
        run: |
          $dir = 'Deka-Desktop-0.19.0-Preview'
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item Deka.exe "$dir/Deka.exe"
          Copy-Item docs/UNIFIED-PREVIEW.md "$dir/READ-ME.md"
          (Get-FileHash Deka.exe -Algorithm SHA256).Hash + "  Deka.exe" | Set-Content "$dir/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Deka-Desktop-0.19.0-Preview-Windows
          path: Deka-Desktop-0.19.0-Preview/
          if-no-files-found: error
