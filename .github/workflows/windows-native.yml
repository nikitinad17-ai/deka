name: Deka 2 Windows manual VK verification
on:
  push:
    branches: [fix/deka2-windows-native-view]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm test
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser.py
      - run: python tests/mixer-browser.py
      - run: python tests/vk-reliability-browser.py
      - run: python tests/library-boundaries-browser.py
      - name: Full document navigation and native VK ownership
        run: python tests/windows-navigation-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-test-results
          path: test-output/
  windows:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: {workspaces: src-tauri}
      - run: npm install
      - run: npm run build
      - name: Verify real installation and desktop shortcut
        shell: pwsh
        run: ./scripts/verify-windows-install.ps1
      - name: Record source and installer checksums
        shell: pwsh
        run: |
          $env:GITHUB_SHA | Out-File source-commit.txt -Encoding utf8
          Get-FileHash Deka2.exe,Deka2-setup.exe -Algorithm SHA256 | Format-List | Out-File SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: Deka2-0.2.3-Windows
          path: |
            Deka2.exe
            Deka2-setup.exe
            SHA256SUMS.txt
            source-commit.txt
          if-no-files-found: error
