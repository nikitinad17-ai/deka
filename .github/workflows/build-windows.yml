name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - run: npm run build

      - name: Версия из package.json
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: deka-windows
          path: |
            Deka.exe
            Deka-setup.exe

      # Готовые файлы выкладываются в Releases: их можно скачать с телефона или компьютера
      # по прямой ссылке, без распаковки артефакта.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Дека ${{ steps.ver.outputs.version }}
          body: |
            Сборка из коммита ${{ github.sha }}.
            Deka-setup.exe — установщик, Deka.exe — плеер без установки.
          files: |
            Deka.exe
            Deka-setup.exe
          make_latest: true
