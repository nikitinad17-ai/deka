name: Source bundle for local regression tests
on:
  push:
    branches: [feature/deka2-0.2.0-vk-mixer]
    paths: [.github/workflows/test-source-bundle.yml]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive checked-out source and Android verification tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/tools/lib64 bundle/tools/lib
          git archive --format=zip HEAD -o bundle/source.zip
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          cp "$bt/lib/apksigner.jar" bundle/tools/lib/
          cp "$bt/zipalign" "$bt/aapt" bundle/tools/
          if [ -d "$bt/lib64" ]; then cp -r "$bt/lib64/." bundle/tools/lib64/; fi
          git rev-parse HEAD > bundle/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: deka2-regression-source
          path: bundle/
          retention-days: 7
          if-no-files-found: error
