name: Deka 2 - independent player and VK source
on:
  push:
    branches: [fix/deka2-0.2.4-player-library]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deka2-player-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm test
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser.py
      - run: python tests/mixer-browser.py
      - run: python tests/vk-reliability-browser.py
      - run: python tests/library-boundaries-browser.py
      - run: python tests/landing-entry-browser.py
      - run: python tests/desktop-flow.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: deka2-0.2.4-browser-tests, path: test-output/}
  windows:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: {workspaces: src-tauri}
      - run: npm install
      - run: npm run build
      - name: Record binary provenance
        shell: pwsh
        run: |
          '${{ github.sha }}' | Set-Content source-commit.txt
          Get-FileHash Deka2.exe,Deka2-setup.exe -Algorithm SHA256 | ConvertTo-Json | Set-Content checksums.json
      - uses: actions/upload-artifact@v4
        with:
          name: INTERNAL-unverified-candidate
          retention-days: 3
          path: |
            Deka2.exe
            Deka2-setup.exe
            source-commit.txt
            checksums.json
          if-no-files-found: error
      - name: Verify installer and actual shortcut target
        run: ./scripts/verify-windows-install.ps1
        shell: pwsh
      - run: python -m pip install -r tests/requirements.txt
      - name: Verify installed application, two WebViews, real IPC and audio
        run: ./scripts/verify-desktop-source.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: Deka2-0.2.4-Windows
          path: |
            Deka2.exe
            Deka2-setup.exe
            source-commit.txt
            checksums.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: deka2-0.2.4-native-tests, path: test-output/}
