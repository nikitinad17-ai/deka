name: Build and test
on:
  workflow_dispatch:
  push:
    branches: [main, feature/v0.10.0-sets]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: deka-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # ubuntu-latest moved to Ubuntu 26 on 2026-10-19: pinned Playwright cannot install its
  # system packages there yet, and the Android SDK/NDK layout is verified on 24.04.
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression-results
          path: test-output/
  windows:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: deka-windows
          path: |
            Deka.exe
            Deka-setup.exe
  android:
    needs: quality
    runs-on: ubuntu-24.04
    outputs:
      kind: ${{ steps.signing.outputs.kind }}
    env:
      REPORT: bash scripts/ci-report.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare protected signing or isolated preview
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
        run: |
          set -euo pipefail
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/deka-signing.p12"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
            export ANDROID_KEY_ALIAS="$KEY_ALIAS"
            export ANDROID_KEYSTORE_PASSWORD="$KEY_PASSWORD"
            echo "kind=signed" >> "$GITHUB_OUTPUT"
            echo "APK_NAME=Deka.apk" >> "$GITHUB_ENV"
            echo "APK_PACKAGE=ru.volna.player" >> "$GITHUB_ENV"
          else
            # A separate app, never an in-place update signed with an exposed key.
            export ANDROID_KEY_ALIAS=preview
            export ANDROID_KEYSTORE_PASSWORD="$(openssl rand -hex 32)"
            echo "::add-mask::$ANDROID_KEYSTORE_PASSWORD"
            keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=Deka Preview" -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEYSTORE_PASSWORD
            node -e "const fs=require('fs'),p='src-tauri/tauri.conf.json',c=JSON.parse(fs.readFileSync(p));c.identifier='ru.volna.player.preview';c.productName='DeKa preview 2.0';fs.writeFileSync(p,JSON.stringify(c,null,2));"
            echo "kind=preview" >> "$GITHUB_OUTPUT"
            echo "APK_NAME=DeKa-preview-2.0.apk" >> "$GITHUB_ENV"
            echo "APK_PACKAGE=ru.volna.player.preview" >> "$GITHUB_ENV"
            echo "::warning::Preview is a separate installation. No update compatibility with 0.8 is claimed."
          fi
          test -s "$ANDROID_KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Android SDK and NDK
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ndk="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$ndk" ]; then ndk=$(ls -d "$sdk"/ndk/* | sort -V | tail -n 1); fi
          test -d "$sdk" && test -d "$ndk"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - name: Generate native project
        run: |
          $REPORT npx tauri android init --ci
          $REPORT npx tauri icon app-icon.png
          $REPORT node scripts/android-sign.js
          $REPORT node scripts/android-webview.js
      - name: Build and verify APK
        run: |
          $REPORT npx tauri android build --apk --target aarch64 --ci
          # The screen-off fix must really be inside the built app, not only in the repo.
          java=src-tauri/gen/android/app/src/main/java
          grep -rlq "DEKA_KEEP_VISIBLE" "$java" || { echo "::error::RustWebView.kt was generated without DEKA_KEEP_VISIBLE (.cargo/config.toml not applied)"; exit 1; }
          grep -rlq "DEKA_BACKGROUND_V4" "$java" || { echo "::error::MainActivity.kt is missing the background patch"; exit 1; }
          grep -rl "DEKA_KEEP_VISIBLE" "$java"
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)
          test -n "$apk"
          cp "$apk" "$APK_NAME"
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$signer" verify --verbose --print-certs "$APK_NAME"
          "$aapt" dump badging "$APK_NAME" > "$RUNNER_TEMP/deka-badging.txt"
          head -n 1 "$RUNNER_TEMP/deka-badging.txt"
          grep -m1 "^application-label:" "$RUNNER_TEMP/deka-badging.txt"
          grep -q "package: name='$APK_PACKAGE'" "$RUNNER_TEMP/deka-badging.txt"
          grep -q "versionName='$(node -p "require('./package.json').version")'" "$RUNNER_TEMP/deka-badging.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: deka-android
          path: ${{ env.APK_NAME }}
      - name: Remove ephemeral signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/deka-signing.p12" src-tauri/gen/android/keystore.properties
  release:
    # main publishes vX.Y.Z; the feature branch publishes a separate test prerelease vX.Y.Z-test.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/v0.10.0-sets')
    needs: [quality, windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          v=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then tag="v$v"; title="Дека $v — проверочная версия"; else tag="v$v-test"; title="Дека $v — тест"; fi
          { echo "version=$v"; echo "tag=$tag"; echo "title=$title"; } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: deka-*
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.ver.outputs.title }}
          prerelease: true
          make_latest: false
          body: |
            Коммит: ${{ github.sha }}. Android build: ${{ needs.android.outputs.kind }}.
            0.10.7: «Показать все» своего раздела ведёт на полный список при любом адресе (как у m.vk.ru/audio?…); адрес запоминается.
            Весь список «Мои треки»: «Показать все» срабатывает в любом виде; включение трека не обрывает загрузку. Вход — только через окно входа «Деки».
            Вход в VK: свой экран «Деки» и отдельное чистое окно входа (стандартный WebView без добавок), закрывается само после входа; сайт VK — отдельной кнопкой.
            Вход в VK во встроенном браузере: куки для окна VK ID, без меток WebView, intent:// по запасной ссылке, «← Дека» — кнопка Android; журнал входа в «Отчёте».
            Вход в VK: на страницах входа «Деки» нет; без входа VK открыт целиком; после входа «Дека» сама открывает «Мои треки». В режиме «VK» — язычок «← Дека» сбоку.
            Android: музыка и сеты продолжают играть при выключенном экране (WebView не уходит в фон, сервис переживает паузы между треками, Wi‑Fi не засыпает; один раз спрашивается снятие экономии батареи).
            «Треки VK» — только ваш список «Мои треки» целиком: главная страница с рекомендациями в библиотеку больше не попадает; «Загрузить всё» открывает ваш список и догружает его до конца. Кнопка «Отчёт» — технический отчёт о странице без названий треков.
            Сеты VK Видео: экран сета, продолжение с места остановки, треклист по таймкодам из описания или свой, листание треков сета.
            Windows: вкладка «Сеты» в медиатеке, ⏮ ⏭ на пульте листают треки сета.
            Звук сетов не скачивается: играет через страницу VK Видео, сохраняются только место и названия.
            Полная накопительная библиотека, два списка и две деки при повороте телефона; VK остаётся одним общим потоком.
            DeKa-preview-2.0.apk — тестовое приложение «DeKa preview 2.0», ставится рядом со старой Декой; предыдущую Preview перед установкой удалить.
            Deka.apk появляется только при настроенных защищённых signing secrets.
            Тесты используют синтетическую VK-разметку; реальная сессия VK и физический сон телефона здесь не проверены.
          files: out/*
          fail_on_unmatched_files: true
