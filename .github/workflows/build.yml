name: Build

# Каждый push в main собирает Деку для Windows и Android и выкладывает файлы в Releases.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: deka-windows
          path: |
            Deka.exe
            Deka-setup.exe

  android:
    runs-on: ubuntu-latest
    env:
      # Если шаг падает, последние строки его вывода попадают в аннотации сборки.
      REPORT: bash scripts/ci-report.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK и NDK (уже есть на машине GitHub)
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ndk="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$ndk" ]; then ndk=$(ls -d "$sdk"/ndk/* 2>/dev/null | sort -V | tail -n 1); fi
          echo "SDK: $sdk"; echo "NDK: $ndk"
          test -d "$sdk" && test -d "$ndk" || { echo "::error::Не найден Android SDK/NDK (SDK=$sdk NDK=$ndk)"; exit 1; }
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - name: Android-проект Tauri
        run: |
          $REPORT npx tauri android init --ci
          $REPORT npx tauri icon app-icon.png
          $REPORT node scripts/android-sign.js
          $REPORT node scripts/android-webview.js
      - name: Сборка .apk
        run: |
          $REPORT npx tauri android build --apk --target aarch64 --ci
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)
          echo "APK: $apk"
          test -n "$apk" || { echo "::error::Файл .apk не найден после сборки"; exit 1; }
          cp "$apk" Deka.apk
      - uses: actions/upload-artifact@v4
        with:
          name: deka-android
          path: Deka.apk

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Версия из package.json
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Дека ${{ steps.ver.outputs.version }}
          body: |
            Сборка из коммита ${{ github.sha }}.
            Deka-setup.exe — установщик для Windows, Deka.exe — плеер без установки.
            Deka.apk — версия для Android (arm64).
          files: |
            out/Deka.exe
            out/Deka-setup.exe
            out/Deka.apk
          make_latest: true
