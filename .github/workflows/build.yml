name: Deka 2 - build and test
on:
  push:
    branches: [deka2, fix/deka2-0.2.1-personal-vk]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deka2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm test
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser.py
      - run: python tests/mixer-browser.py
      - run: python tests/vk-reliability-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: deka2-browser-tests, path: test-output/}
  windows:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: {workspaces: src-tauri}
      - run: npm install
      - run: npm run build
      - name: Verify installation and desktop shortcut
        shell: pwsh
        run: ./scripts/verify-windows-install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: deka2-windows
          path: |
            Deka2.exe
            Deka2-setup.exe
          if-no-files-found: error
  android:
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.signing.outputs.kind }}
    env:
      REPORT: bash scripts/ci-report.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 17}
      - run: npm run prepare:brand
      - name: Use existing protected key or prepare offline signing
        id: signing
        env:
          KEY_B64: ${{ secrets.DEKA2_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.DEKA2_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DEKA2_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [ -n "$KEY_B64" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/deka2-signing.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/deka2-signing.p12" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo 'kind=signed' >> "$GITHUB_OUTPUT"
            echo 'APK_NAME=Deka2.apk' >> "$GITHUB_ENV"
          else
            # Never replace signing identity. Owner signs this artifact offline with the 0.1.0 key.
            echo 'kind=unsigned' >> "$GITHUB_OUTPUT"
            echo 'APK_NAME=Deka2-unsigned.apk' >> "$GITHUB_ENV"
          fi
      - name: Android SDK and NDK
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ndk="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$ndk" ]; then ndk=$(ls -d "$sdk"/ndk/* | sort -V | tail -n 1); fi
          test -d "$sdk" && test -d "$ndk"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: aarch64-linux-android}
      - uses: swatinem/rust-cache@v2
        with: {workspaces: src-tauri}
      - run: npm install
      - name: Generate native project
        run: |
          $REPORT npx tauri android init --ci
          $REPORT npx tauri icon app-icon.png
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then $REPORT node scripts/android-sign.js; fi
          $REPORT node scripts/android-webview.js
      - name: Build and verify package identity
        run: |
          set -euo pipefail
          $REPORT npx tauri android build --apk --target aarch64 --ci
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)
          test -n "$apk"
          cp "$apk" "$APK_NAME"
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$aapt" dump badging "$APK_NAME" > Deka2-package.txt
          grep -q "package: name='ru.deka2.player'" Deka2-package.txt
          grep -q "versionName='0.2.1'" Deka2-package.txt
          grep -q "application-label:'Deka 2'" Deka2-package.txt
          if [ "$APK_NAME" = Deka2.apk ]; then
            signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
            "$signer" verify --verbose --print-certs "$APK_NAME"
          fi
          echo "${{ github.sha }}" > source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: deka2-android-build
          path: |
            ${{ env.APK_NAME }}
            Deka2-package.txt
            source-commit.txt
          if-no-files-found: error
      - name: Remove plaintext signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/deka2-signing.p12" src-tauri/gen/android/keystore.properties
  release:
    if: github.ref == 'refs/heads/deka2'
    needs: [quality, windows, android]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: deka2-windows, path: out}
      - uses: actions/download-artifact@v4
        if: needs.android.outputs.kind == 'signed'
        with: {name: deka2-android-build, path: out}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: deka2-v0.2.1
          target_commitish: ${{ github.sha }}
          name: Дека 2 - 0.2.1
          prerelease: true
          make_latest: false
          body: |
            Personal VK library only; verified viewer identity; reliable native playback and resume.
            Two local decks; VK is one shared stream. No claims of a real VK-account test.
            Includes account isolation, no-op-click rejection, playback confirmation, resume and fader regression tests.
            Android signing mode: ${{ needs.android.outputs.kind }}.
            Unsigned Android build artifacts are NOT installers and are not released here.
            With offline signing, the installable APK is delivered separately after signature verification.
          files: out/*
          fail_on_unmatched_files: true
