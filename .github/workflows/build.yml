name: Deka 2 - build and test
on:
  push:
    branches: [deka2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deka2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deka2-browser-tests
          path: test-output/
  windows:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: deka2-windows
          path: |
            Deka2.exe
            Deka2-setup.exe
          if-no-files-found: error
  android:
    needs: quality
    runs-on: ubuntu-latest
    env:
      REPORT: bash scripts/ci-report.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.3
      - name: Prepare Deka 2 identity
        run: npm run prepare:brand
      - name: Use protected key or bootstrap first Deka 2 key
        env:
          DEKA2_KEYSTORE_B64: ${{ secrets.DEKA2_KEYSTORE_BASE64 }}
          DEKA2_ALIAS: ${{ secrets.DEKA2_KEY_ALIAS }}
          DEKA2_PASSWORD: ${{ secrets.DEKA2_KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p dist-signing
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/deka2-signing.p12"
          if [ -n "$DEKA2_KEYSTORE_B64" ] && [ -n "$DEKA2_ALIAS" ] && [ -n "$DEKA2_PASSWORD" ]; then
            printf '%s' "$DEKA2_KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
            export ANDROID_KEY_ALIAS="$DEKA2_ALIAS"
            export ANDROID_KEYSTORE_PASSWORD="$DEKA2_PASSWORD"
          else
            # Never generate a replacement signing identity for an already published app.
            test "$(node -p "require('./package.json').version")" = '0.1.0' || { echo 'Configure DEKA2 signing secrets using the existing key.'; exit 1; }
            code=$(curl -sS -o "$RUNNER_TEMP/deka2-release.json" -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/deka2-v0.1.0")
            test "$code" = '404' || { echo 'First Deka 2 release already exists, or GitHub did not confirm its absence. Restore its key to DEKA2 Secrets; refusing key replacement.'; exit 1; }
            export ANDROID_KEY_ALIAS=deka2
            export ANDROID_KEYSTORE_PASSWORD="$(openssl rand -hex 32)"
            echo "::add-mask::$ANDROID_KEYSTORE_PASSWORD"
            keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=Deka 2, O=Alex Nikitin' -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEYSTORE_PASSWORD
          fi
          test -s "$ANDROID_KEYSTORE_PATH"
          python scripts/signing-envelope.py seal keys/deka2-recovery-public.pem dist-signing/Deka2-signing-backup.sealed.json
          echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Android SDK and NDK
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ndk="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$ndk" ]; then ndk=$(ls -d "$sdk"/ndk/* | sort -V | tail -n 1); fi
          test -d "$sdk" && test -d "$ndk"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - name: Generate Deka 2 native project
        run: |
          $REPORT npx tauri android init --ci
          $REPORT npx tauri icon app-icon.png
          $REPORT node scripts/android-sign.js
          $REPORT node scripts/android-webview.js
      - name: Build and verify Deka 2 APK
        run: |
          set -euo pipefail
          $REPORT npx tauri android build --apk --target aarch64 --ci
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)
          test -n "$apk"
          cp "$apk" Deka2.apk
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$signer" verify --verbose --print-certs Deka2.apk | tee "$RUNNER_TEMP/deka2-cert.txt"
          "$aapt" dump badging Deka2.apk > "$RUNNER_TEMP/deka2-badging.txt"
          head -n 1 "$RUNNER_TEMP/deka2-badging.txt"
          grep -q "package: name='ru.deka2.player'" "$RUNNER_TEMP/deka2-badging.txt"
          grep -q "versionName='0.1.0'" "$RUNNER_TEMP/deka2-badging.txt"
          grep -q "application-label:'Deka 2'" "$RUNNER_TEMP/deka2-badging.txt"
          "$aapt" dump xmltree Deka2.apk AndroidManifest.xml > "$RUNNER_TEMP/deka2-manifest.txt"
          grep -q 'DekaPlaybackService' "$RUNNER_TEMP/deka2-manifest.txt"
          sha256sum Deka2.apk > dist-signing/Deka2-SHA256.txt
          cp "$RUNNER_TEMP/deka2-cert.txt" dist-signing/Deka2-signature.txt
      - uses: actions/upload-artifact@v4
        with:
          name: deka2-android
          path: Deka2.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: deka2-encrypted-signing-backup
          path: dist-signing/
          if-no-files-found: error
      - name: Delete plaintext signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/deka2-signing.p12" src-tauri/gen/android/keystore.properties
  release:
    if: github.ref == 'refs/heads/deka2'
    needs: [quality, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: node -e 'require("fs").appendFileSync(process.env.GITHUB_OUTPUT,"version="+require("./package.json").version+"\n")'
      - uses: actions/download-artifact@v4
        with:
          pattern: deka2-*
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: deka2-v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Дека 2 - ${{ steps.ver.outputs.version }}
          prerelease: true
          make_latest: false
          body: |
            Отдельное приложение «Дека 2». Коммит ${{ github.sha }}.
            Deka2.apk — новая установка рядом с Декой 1 и Preview, не обновляет их.
            Android: ru.deka2.player. Новый ключ, зашифрованная резервная копия сохранена.
            Deka2-setup.exe и Deka2.exe — отдельная Windows-версия с двухдековым интерфейсом.
            Два локальных файла сводятся независимо; VK остаётся одним потоком.
            Пройдены тесты библиотеки, интерфейса и изоляции приложения. Живая VK-сессия и физический телефон не тестировались.
          files: |
            out/Deka2.apk
            out/Deka2.exe
            out/Deka2-setup.exe
            out/Deka2-signing-backup.sealed.json
            out/Deka2-SHA256.txt
            out/Deka2-signature.txt
          fail_on_unmatched_files: true
