name: Build

# Каждый push в main проходит smoke-тесты, собирает Windows и Android и публикует Release.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke tests
        run: npm test

  windows:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: deka-windows
          path: |
            Deka.exe
            Deka-setup.exe

  android:
    needs: quality
    runs-on: ubuntu-latest
    env:
      REPORT: bash scripts/ci-report.sh
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Подготовить Android signing
        id: signing
        shell: bash
        run: |
          mkdir -p android
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/deka-release.p12
            test -s android/deka-release.p12 || { echo "::error::ANDROID_KEYSTORE_BASE64 не декодируется в keystore"; exit 1; }
            echo "source=secret" >> "$GITHUB_OUTPUT"
          elif [ "$(node -p "require('./package.json').version")" = "0.7.0" ]; then
            # Одноразовая совместимость обновления: текущие телефоны установлены с ключом 0.6.x.
            # Ключ уже был опубликован в истории репозитория и считается скомпрометированным.
            # После 0.7.0 fallback автоматически перестаёт работать.
            legacy="eefd71b253e94a0cc3a27e8ab88ab5294f2eb11c"
            git show "${legacy}:android/deka-release.p12" > android/deka-release.p12
            cfg="$(git show "${legacy}:android/signing.json")"
            alias="$(printf '%s' "$cfg" | python3 -c 'import json,sys; print(json.load(sys.stdin)["keyAlias"])')"
            password="$(printf '%s' "$cfg" | python3 -c 'import json,sys; print(json.load(sys.stdin)["password"])')"
            echo "::add-mask::$alias"
            echo "::add-mask::$password"
            echo "ANDROID_KEY_ALIAS=$alias" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
            echo "source=legacy-update-only" >> "$GITHUB_OUTPUT"
            echo "::warning::0.7.0 подписывается старым ключом только для обновления поверх 0.6.x. Для следующих версий нужны GitHub Secrets с новым signing key."
          else
            echo "source=none" >> "$GITHUB_OUTPUT"
            echo "::warning::Android APK пропущен: настройте ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS и ANDROID_KEYSTORE_PASSWORD."
            exit 0
          fi
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/deka-release.p12" >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Android SDK и NDK
        if: steps.signing.outputs.available == 'true'
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ndk="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$ndk" ]; then ndk=$(ls -d "$sdk"/ndk/* 2>/dev/null | sort -V | tail -n 1); fi
          echo "SDK: $sdk"; echo "NDK: $ndk"
          test -d "$sdk" && test -d "$ndk" || { echo "::error::Не найден Android SDK/NDK (SDK=$sdk NDK=$ndk)"; exit 1; }
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.signing.outputs.available == 'true'
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        if: steps.signing.outputs.available == 'true'
        with:
          workspaces: src-tauri
      - run: npm install
        if: steps.signing.outputs.available == 'true'
      - run: npm test
        if: steps.signing.outputs.available == 'true'
      - name: Android-проект Tauri
        if: steps.signing.outputs.available == 'true'
        run: |
          $REPORT npx tauri android init --ci
          $REPORT npx tauri icon app-icon.png
          $REPORT node scripts/android-sign.js
          $REPORT node scripts/android-webview.js
      - name: Сборка .apk
        if: steps.signing.outputs.available == 'true'
        run: |
          $REPORT npx tauri android build --apk --target aarch64 --ci
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)
          echo "APK: $apk"
          test -n "$apk" || { echo "::error::Файл .apk не найден после сборки"; exit 1; }
          cp "$apk" Deka.apk
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.available == 'true'
        with:
          name: deka-android
          path: Deka.apk

  release:
    needs: [quality, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Версия из package.json
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Дека ${{ steps.ver.outputs.version }}
          body: |
            Сборка из коммита ${{ github.sha }}.
            Deka-setup.exe — установщик Windows.
            Deka.exe — Windows без установки.
            Deka.apk — Android arm64, можно ставить поверх 0.6.x.
            В 0.7.0 добавлено фоновое воспроизведение Android при погасшем экране и smoke-тесты релиза.
          files: out/*
          fail_on_unmatched_files: false
          make_latest: true
