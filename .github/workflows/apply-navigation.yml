name: Apply Windows navigation source
on:
  push:
    branches: [fix/deka2-windows-native-view]
    paths: [.github/workflows/apply-navigation.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact source edits
        run: |
          python3 .transfer/apply-navigation.py
          git add package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json src-tauri/src/lib.rs src/deck-engine.js src/library-runtime.js src/mobile-overlay.js src/player-controls.js src/vk-mixer-policy.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Windows: manual native VK mode, no automatic view takeover'
          git push origin HEAD:fix/deka2-windows-native-view
