name: Wallpaper prototype Windows build
on:
  push:
    branches: [feature/desktop-wallpaper-0.1.0]
permissions:
  contents: read
concurrency:
  group: deka-wallpaper-prototype
  cancel-in-progress: true
jobs:
  windows-prototype:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm install
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt psutil
      - name: Prototype checks only; no claim of background acceptance
        run: python scripts/native-wallpaper-prototype-ci.py Deka-Wallpaper.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wallpaper-prototype-verification
          path: test-output/
      - run: python scripts/package-wallpaper-prototype.py
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: wallpaper-v0.1.0-prototype.1
          target_commitish: ${{ github.sha }}
          name: Deka Desktop Wallpaper 0.1.0 — ПРОТОТИП
          prerelease: true
          make_latest: false
          body_path: prototype-out/RELEASE-NOTES.md
          files: |
            prototype-out/Deka-Wallpaper.exe
            prototype-out/Deka-Wallpaper-setup.exe
            prototype-out/Deka-Desktop-Wallpaper-0.1.0-Prototype-Windows.zip
            prototype-out/TEST-REPORT.txt
            prototype-out/SHA256SUMS.txt
          fail_on_unmatched_files: true
