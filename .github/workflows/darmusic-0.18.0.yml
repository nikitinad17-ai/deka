name: Dar Music 0.18.0 visual edition
on:
  push:
    branches: [feature/desktop-darmusic-0.18.0]
permissions:
  contents: read
concurrency:
  group: deka-darmusic-018
  cancel-in-progress: true
jobs:
  windows-darmusic:
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Preserve repository source bytes on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm install
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python tests/darmusic_source.py
      - run: npm run build
      - name: Exact Windows EXE visual and complete audio regression
        timeout-minutes: 9
        run: python scripts/native-darmusic-ci.py Deka-DarMusic.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: darmusic018-verification
          path: test-output/
      - run: python scripts/package-darmusic018.py
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: darmusic-v0.18.0
          target_commitish: ${{ github.sha }}
          name: dar music — Deka Desktop 0.18.0
          prerelease: true
          make_latest: false
          body_path: darmusic-out/RELEASE-NOTES.md
          files: |
            darmusic-out/*.exe
            darmusic-out/Deka-DarMusic-0.18.0-Windows.zip
            darmusic-out/SHA256SUMS.txt
            darmusic-out/TEST-REPORT.txt
          fail_on_unmatched_files: true
      - uses: actions/upload-artifact@v4
        with:
          name: darmusic018-release
          path: darmusic-out/
