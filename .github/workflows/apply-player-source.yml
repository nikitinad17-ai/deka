name: Apply readable Windows source migration
on:
  push:
    branches: [fix/deka2-0.2.4-player-library]
    paths: [scripts/apply-player-fix.py, .github/workflows/apply-player-source.yml]
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Apply source files without writing workflow files
        run: |
          set -euo pipefail
          npm run prepare:brand
          python scripts/apply-player-fix.py
          rm scripts/apply-player-fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src src-tauri tests package.json scripts/apply-player-fix.py
          git commit -m 'Windows 0.2.4: independent player, real personal entry and SPA collector ownership'
          git push origin HEAD:fix/deka2-0.2.4-player-library
