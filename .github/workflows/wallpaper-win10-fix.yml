name: Wallpaper Windows 10 shell fix
on:
  push:
    branches: [fix/wallpaper-win10-shell]
permissions:
  contents: read
concurrency:
  group: wallpaper-win10-fix
  cancel-in-progress: true
jobs:
  shell:
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm install
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: wallpaper-win10-fix-candidate
          path: |
            Deka-Wallpaper.exe
            Deka-Wallpaper-setup.exe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt psutil pillow
      - name: Actual existing shell, visible icon, input, audio and Explorer restart
        run: python scripts/native-wallpaper-shell-ci.py Deka-Wallpaper.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wallpaper-win10-fix-evidence
          path: |
            test-output/*.json
            test-output/*.txt
            test-output/*.png
      - name: Package verified release candidate
        env:
          DEKA_SOURCE_SHA: ${{ github.sha }}
          DEKA_TEST_RUN: ${{ github.run_id }}
        run: python scripts/package-wallpaper-win10-fix.py
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: wallpaper-v0.1.2-rc.1
          target_commitish: ${{ github.sha }}
          name: Deka Wallpaper 0.1.2 RC1 — прямая привязка фона Windows 10
          prerelease: true
          make_latest: false
          body_path: wallpaper-fix-out/READ-ME-FIRST.txt
          files: |
            wallpaper-fix-out/Deka-Wallpaper-0.1.2-RC1-Windows.zip
            wallpaper-fix-out/Deka-Wallpaper.exe
            wallpaper-fix-out/Deka-Wallpaper-setup.exe
            wallpaper-fix-out/SHA256SUMS.txt
          fail_on_unmatched_files: true
      - uses: actions/upload-artifact@v4
        with:
          name: wallpaper-win10-fix-release
          path: wallpaper-fix-out/
