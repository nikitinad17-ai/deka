name: Windows navigation source
on:
  push:
    branches: [fix/deka2-windows-native-view]
    paths: [.github/workflows/native-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip -o source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: windows-navigation-source
          path: source.zip
          retention-days: 3
